<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 220px;
            padding: 15px;
            font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
            background-color: #f5f5f5;
        }

        h3 {
            margin: 0 0 15px 0;
            font-size: 16px;
            color: #333;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #c62828;
            /* 落ち着いた赤 */
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #a31c1c;
        }

        button:active {
            background: #7a1414;
        }
    </style>
</head>

<body>
    <h3>UL要素ビジュアライザー</h3>
    <button id="select-btn">ULを選択モードを開始</button>
    <script src="popup.js"></script>
</body>

</html>
